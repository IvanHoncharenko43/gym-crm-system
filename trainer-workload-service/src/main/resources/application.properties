spring.application.name=trainer-workload-service

server.port=8082

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration=${JWT_EXPIRATION}

info.app.name=Trainer Workload Service
info.app.description=Spring Boot Microservice for Trainer Workload Tracking
info.app.version=1.0.0

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
management.server.port=8083