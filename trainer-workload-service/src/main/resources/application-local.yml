spring:
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://admin:adminPassword@localhost:27020/trainer_workloads?authSource=admin}
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost:9092}
  data:
    mongodb:
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8082}

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY:SdM6oy/wkfKckcHf2PX1oNTvmC4C7WteH4RLg6Lg6Nw=}
    expiration: ${JWT_EXPIRATION:7200000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

logging:
  level:
    root: info
    org.example.workload: debug
    org.springframework.web: info

management:
  server:
    port: ${MANAGEMENT_PORT:8083}
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always