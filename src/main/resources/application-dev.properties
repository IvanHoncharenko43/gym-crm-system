# ===================================================================
# Spring Boot Configuration - DEV (Development) Environment
# ===================================================================
# This profile is used for the remote development environment (e.g., on a server or Kubernetes).
# According to security best practices, all sensitive properties must be passed via environment variables.

# 1. Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# 2. Database Configuration (Remote Dev PostgreSQL)
# SENSITIVE DATA IS NOT HARDCODED! Passed via environment variables.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://dev-db-server.internal:5432/gym_crm_dev}
spring.datasource.username=${DATABASE_USERNAME:gym_dev_user}
spring.datasource.password=${DATABASE_PASSWORD:dev_secure_password_fallback}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. JPA / Hibernate Settings
# In dev/production, automatic schema modification (update/create) is forbidden.
# We must use 'validate' as recommended by the mentor.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Turn off SQL printing in logs to prevent log pollution and high disk usage
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 4. Logging Configuration
# Standard logging level for development servers
logging.level.root=INFO
logging.level.org.example=INFO
logging.level.org.springframework.web=INFO
# Prevent exposing SQL parameters in server logs for security
logging.level.org.hibernate.SQL=WARN

# 5. Spring Boot Actuator
# Expose only required endpoints (health check and prometheus metrics)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when_authorized

# 6. Swagger / OpenAPI
# Enable Swagger on dev for testing, but can be disabled in stg/prod
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true