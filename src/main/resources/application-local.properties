server.port=8080
server.servlet.context-path=/api/v1

# 2. Database Configuration (Local PostgreSQL)
# Local developer can run a DB in Docker with these default credentials.
# Environment variables can still override them if needed.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gym_crm}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. JPA / Hibernate Settings
# In local, we can automatically update the schema or validate it.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Show and format SQL queries in console for local debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# 4. Logging Configuration
# Verbose logging for local debugging
logging.level.root=INFO
logging.level.org.example=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# 5. Spring Boot Actuator
# Expose all endpoints in local for testing and debugging
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# 6. Swagger / OpenAPI
# Enable Swagger UI for local API interaction
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true