# ===================================================================
# PRODUCTION ENVIRONMENT CONFIGURATION (application-prod.properties)
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# Production Database Connection (PostgreSQL)
# STRICT: No hardcoded fallback credentials for production to prevent accidental local connections.
# The application will fail-fast at startup if these environment variables are missing.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties
# Strictly 'validate' to protect production data from schema corruption
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
# Production uses WARN/ERROR to maximize performance and avoid leaking PII (Personally Identifiable Information)
logging.level.root=WARN
logging.level.org.example=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=ERROR

# Actuator & Prometheus Monitoring
# Strictly secure: details are hidden, metrics are only exposed internally
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.info.env.enabled=false