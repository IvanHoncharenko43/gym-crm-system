spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration=${JWT_EXPIRATION}

security.cors.allowed-origins=*
security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE
security.cors.allowed-headers=Authorization,Content-Type,Cache-Control
security.cors.exposed-headers=Authorization

info.app.name=Gym CRM System
info.app.description=Spring Boot Implementation of Gym CRM
info.app.version=1.0.0

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

management.server.port=8081

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,dbPrivileges
management.health.db-privileges.required-tables=users,trainees,trainers,trainings,training_types
management.health.db-privileges.required-privileges-by-table.trainee=SELECT,INSERT,UPDATE,DELETE