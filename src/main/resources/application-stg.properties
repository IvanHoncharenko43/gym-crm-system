# ===================================================================
# STAGING ENVIRONMENT CONFIGURATION (application-stg.properties)
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# Staging Database Connection (PostgreSQL)
# Uses environment variables with staging fallbacks
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://stg-db-server:5432/gym_crm_stg}
spring.datasource.username=${DATABASE_USERNAME:stg_crm_user}
spring.datasource.password=${DATABASE_PASSWORD:stg_secure_pass_987}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties
# 'validate' is mandatory for staging to ensure schema matches migrations (Liquibase/Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
# Staging uses INFO level to monitor application state without debug noise
logging.level.root=INFO
logging.level.org.example=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# Actuator & Prometheus Monitoring
# Staging monitors health and metrics, exposed on a separate management port (8081)
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when_authorized