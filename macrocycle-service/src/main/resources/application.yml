spring:
  application:
    name: macrocycle-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mongodb:
    uri: ${SPRING_MONGODB_URI}
  ai:
    google:
      genai:
        chat:
          model: ${AI_MODEL}
        api-key: ${GEMINI_API_KEY}

server:
  port: ${SERVER_PORT}

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration: ${JWT_EXPIRATION}
    roles-claim: roles

macrocycle:
  generation:
    max-iterations: 2
    planner-timeout: 60s
    verifier-timeout: 30s
    job-timeout: 5m
    core-pool-size: 2
    max-pool-size: 5
  job-retention-days: 7

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

management:
  server:
    port: ${MANAGEMENT_PORT}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState

info:
  app:
    name: Macrocycle Generation Service
    description: Spring AI-driven multi-week training plan generation
    version: 1.0.0
