spring:
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://admin:adminPassword@localhost:27021/macrocycles?authSource=admin}
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
  data:
    mongodb:
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8084}

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY:SdM6oy/wkfKckcHf2PX1oNTvmC4C7WteH4RLg6Lg6Nw=}
    expiration: ${JWT_EXPIRATION:7200000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

logging:
  level:
    root: info
    org.example.macrocycle: debug
    org.springframework.web: info

