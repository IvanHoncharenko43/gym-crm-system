spring:
  application:
    name: crm-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  http:
    clients:
      connect-timeout: 1s
      read-timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_HOST}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        delivery.timeout.ms: 120000
        enable.idempotence: true
        spring.json.add.type.headers: true
        spring.json.type.mapping: updateWorkloadEvent:org.example.crm.trainer.messaging.TrainerWorkloadUpdateEvent

server:
  port: ${SERVER_PORT}

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration: ${JWT_EXPIRATION}
    roles-claim: roles
  security:
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,PATCH,DELETE
      allowed-headers: Authorization,Content-Type,Cache-Control
      exposed-headers: Authorization
    admin:
      usernames: ${ADMIN_USERNAMES:}
  client:
    services:
      workload-id: ${WORKLOAD_ID}
  kafka:
    topics:
      trainer-workload-update: "trainer-workload-update-event"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}

management:
  server:
    port: ${MANAGEMENT_PORT}
  health:
    db-privileges:
      required-tables: users,trainees,trainers,trainings,training_types
      required-privileges-by-table:
        trainee: SELECT,INSERT,UPDATE,DELETE
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db
            - dbPrivileges

resilience4j:
  circuitbreaker:
    instances:
      trainerWorkloadService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.example.crm.exception.DownstreamServerErrorException
          - org.example.crm.exception.DownstreamRetryableClientException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
        ignore-exceptions:
          - org.example.crm.exception.DownstreamClientErrorException
  retry:
    instances:
      trainerWorkloadService:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.example.crm.exception.DownstreamServerErrorException
          - org.example.crm.exception.DownstreamRetryableClientException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
        ignore-exceptions:
          - org.example.crm.exception.DownstreamClientErrorException

info:
  app:
    name: Gym CRM System
    description: Spring Boot Microservice for Gym CRM
    version: 1.0.0