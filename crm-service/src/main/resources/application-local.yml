spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/gym_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password1234}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost:9092}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret-key: ${JWT_SECRET_KEY:SdM6oy/wkfKckcHf2PX1oNTvmC4C7WteH4RLg6Lg6Nw=}
  expiration: ${JWT_EXPIRATION:7200000}

security:
  admin:
    usernames: ${ADMIN_USERNAMES:John.Doe27}

client:
  services:
    workload-id: ${WORKLOAD_ID:trainer-workload-service}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

logging:
  level:
    root: info
    org.example.crm: debug
    org.springframework.web: info
    org.hibernate.sql: debug

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always